name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m unittest discover -v
      - run: pyinstaller --onefile --windowed --name GRG4372_LogInspector --add-data "rules.json;." --collect-all artifact_tool enhanced.py
      - uses: actions/upload-artifact@v4
        with:
          name: GRG4372_LogInspector_V1.2
          path: dist/GRG4372_LogInspector.exe
